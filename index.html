<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orc Swarm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <div id="board">
  <div id="world">
    <canvas id="terrain" width="960" height="540"></canvas>
    <canvas id="decal" width="960" height="540"></canvas>
    <canvas id="glc" width="1920" height="1080"></canvas>
    <canvas id="fx" width="1920" height="1080"></canvas>
  </div>
  <div id="flash"></div>
  <div id="leakv"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="top">
      <div id="hplbl">Health</div>
      <div id="hpbar"><i id="hpfill"></i><b id="hptxt">50 / 50</b></div>
      <div id="counters">
        <div class="ctr" title="Orcs still to come"><canvas width="32" height="28" data-pix="horde"></canvas><span id="c-rem">0</span></div>
        <div class="ctr" title="Orcs on the field"><canvas width="16" height="28" data-pix="orc"></canvas><span id="c-alive">0</span></div>
        <div class="ctr" title="Orcs slain"><canvas width="16" height="28" data-pix="skel"></canvas><span id="c-kills">0</span></div>
      </div>
    </div>
    <div id="banner" class="hbox"><h2>BUILD PHASE</h2><p>Press SPACE to start battle</p></div>
    <div id="toolbar" class="hbox"></div>
    <div id="buildTools" class="board-tools hidden"><button id="buildDone">Deselect</button><button id="arcLess">Arc -</button><button id="arcMore">Arc +</button><button id="buildRemove">Remove</button></div>
    <div id="mousebox" class="hbox" title="Controls">
      <svg width="22" height="34" viewBox="0 0 22 34"><rect x="1.5" y="1.5" width="19" height="31" rx="9.5" fill="none" stroke="#f2f2f2" stroke-width="2"/><path d="M11 2v10M2 12h18" stroke="#f2f2f2" stroke-width="2" fill="none"/></svg>
    </div>
    <div id="hintL" class="hbox"></div>
    <button id="btnStart" class="hbox">Start Battle</button>
    <div id="battlectl">
      <button id="btnSpeed" class="hbox">x1</button>
      <button id="btnPause" class="hbox">II</button>
    </div>
    <button id="btnMenu" class="hbox" title="Menu (Esc)">&#9776;</button>
  </div>

  <div id="screen-upgrades" class="screen hidden">
    <div id="upHead">
      <h1>Upgrades</h1>
      <div id="wallet">
        <div class="chip" data-cur="crystal" title="Crystals: earned from kills"><canvas width="48" height="48" data-icon="crystal" data-color="#59b8ff"></canvas><b>0</b></div>
        <div class="chip" data-cur="orb" title="Orbs: earned from a level's first win"><canvas width="48" height="48" data-icon="orb" data-color="#ffa03a"></canvas><b>0</b></div>
        <div class="chip" data-cur="cube" title="Cubes: earned from a flawless first win"><canvas width="48" height="48" data-icon="cube" data-color="#ff6fd8"></canvas><b>0</b></div>
      </div>
    </div>
    <div id="upTabs"></div>
    <div id="upInfo">
      <canvas id="upIcon" width="112" height="112"></canvas>
      <div class="who"><h2 id="upTitle"></h2><p id="upDesc"></p></div>
      <p id="upNote"></p>
      <div class="prog"><div class="meter"><i id="upBar"></i></div><span id="upCount"></span></div>
    </div>
    <div id="upGrid"></div>
    <div id="upFoot">
      <button id="btnUpBack" class="small">Menu</button>
      <p>Crystals come from kills - Orbs from a level's first win - Cubes from a flawless first win</p>
      <button id="btnPlay" class="big">Play <kbd>ENTER</kbd></button>
    </div>
  </div>

  <div id="screen-title" class="screen">
    <div class="logo">
      <div class="l1">ORC</div>
      <div class="l3">SWARM</div>
      <div class="l4">You hold the high ground. They only need a gap.</div>
    </div>
    <div class="menu">
      <button id="btnContinue" class="big">Play</button>
      <button id="btnVR" class="small wide hidden">Enter VR</button>
      <button id="btnNew" class="small wide">New Game</button>
      <button id="btnSound" class="small wide">Sound: On</button>
    </div>
  </div>

  <div id="screen-levels" class="screen hidden">
    <h1>Choose a Battlefield</h1>
    <div id="levelgrid"></div>
    <button id="btnLevelsBack" class="small back">Upgrades</button>
  </div>

  <div id="screen-result" class="screen modal hidden">
    <div class="panel">
      <h1 id="resTitle">Victory</h1>
      <div id="resBody"></div>
      <div class="row">
        <button id="btnResAgain" class="small">Retry</button>
        <button id="btnResNext" class="small">Next Level</button>
        <button id="btnResUp" class="big">Upgrades</button>
      </div>
    </div>
  </div>

  <div id="screen-pause" class="screen modal hidden">
    <div class="panel">
      <h1>Paused</h1>
      <div class="row col">
        <button id="btnResume" class="big">Resume</button>
        <button id="btnRestart" class="small wide">Restart Level</button>
        <button id="btnQuit" class="small wide">Quit to Upgrades</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/icons.js"></script>
<script src="js/weapons.js"></script>
<script src="js/abilities.js"></script>
<script src="js/meta.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/vr.js"></script>
</body>
</html>
